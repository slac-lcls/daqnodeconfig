---

- hosts: "{{ host }}"
  gather_facts: false
  become: true 
 
  pre_tasks:
    - name: Are the required extra variables defined?
      ansible.builtin.assert:
        that:
          - host is defined and host | length > 0
          - source_file is defined and source_file | length > 0
          - backup_root is defined and backup_root | length > 0
        fail_msg: >
          A 'host', 'source_file', and 'backup_root' must be supplied as extra variables (-e "host=..." -e "source_file=..." -e "backup_root  =...").

  tasks:    
    - name: Create common backup directory on Ansible controller
      ansible.builtin.file:
        path: "{{ backup_root }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      run_once: true

    - name: Fetch file from each node
      ansible.builtin.fetch:
        src: "{{ source_file }}"
        dest: "{{ backup_root }}/{{ inventory_hostname }}/{{ inventory_hostname }}_{{ source_file | basename }}"
        flat: true