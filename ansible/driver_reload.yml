# This playbook reloads the datadev driver on the nodes. It should be run if datadev.service is already installed,
# otherwise run files_update.yml instead.
#
# how to run the script
# ansible-playbook driver_reload.yml -K -e host='TMO_hsd_drp RIX_hsd_drp XPP_hsd_drp'

# RM 2026-03-11: Initial version
# 2026-10-28: uses the shared steps in tasks/ (Claude)
---
- hosts: "{{ host }}"
  gather_facts: false
  become: true

  vars:
    required_vars: [host]
    require_datadev_service: true

  tasks:
    - ansible.builtin.import_tasks: tasks/preflight.yml
    - ansible.builtin.import_tasks: tasks/service_present.yml

    # No rmmod here: datadev.service's ExecStartPre unloads the old module itself
    - name: Reload driver
      ansible.builtin.shell: |
        systemctl daemon-reload
        systemctl start datadev.service
        systemctl enable datadev.service
