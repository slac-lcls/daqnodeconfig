# This playbook updates the driver on the nodes. The driver is reloaded only if datadev.service is
# already installed on the node; otherwise run files_update.yml to install the service file too.
#
# how to run the script
# ansible-playbook driver_update.yml -K -e host='TMO_hsd_drp RIX_hsd_drp XPP_hsd_drp' -e driver='7.4.0'
# optional: -e repo='rocky' -e version='9.6' to pick a driver build for another distro release

# RM 2026-03-11: Initial version
# RM 2026-04-03: Claude proofed
# 2026-10-28: rebuilt from the shared steps in tasks/ (Claude)
---
- hosts: "{{ host }}"
  gather_facts: true
  gather_subset:  # for faster loading of facts, only gather minimal facts and not all facts
  - '!all'
  - 'min'
  become: true

  vars:
    required_vars: [host, driver]

  tasks:
    - ansible.builtin.import_tasks: tasks/preflight.yml
    - ansible.builtin.import_tasks: tasks/service_present.yml
    - ansible.builtin.import_tasks: tasks/driver.yml

  handlers:
    - ansible.builtin.import_tasks: handlers/datadev.yml
