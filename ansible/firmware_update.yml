# This playbook updates the firmware on the nodes. It should be run if datadev.service is already installed,
# otherwise run files_update.yml before. If new firmware was written the node is power-cycled.
#
# how to run the script
# ansible-playbook firmware_update.yml -K -e host='TMO_hsd_drp RIX_hsd_drp XPP_hsd_drp' -e firmware='hsd'

# RM 2026-03-11: Initial version
# RM 2026-04-03: Claude proofed
# 2026-10-28: rebuilt from the shared steps in tasks/ (Claude)
---
- hosts: "{{ host }}"
  gather_facts: false
  become: true

  vars:
    required_vars: [host, firmware]

  tasks:
    - ansible.builtin.import_tasks: tasks/preflight.yml
    - ansible.builtin.import_tasks: tasks/firmware.yml

  handlers:
    - ansible.builtin.import_tasks: handlers/datadev.yml
