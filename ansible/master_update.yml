# Master update playbook for updating firmware, driver and service on the DRP nodes.
# Each device type runs srcf_manual.yml with its own host groups, driver, service and firmware.
# A tag must be given to select the device type; running without one is refused, because
# srcf_manual.yml flashes firmware and power-cycles the node when the firmware changes.
# Service files are the ones currently installed on the nodes (checked 2026-10-28).

# how to run:
# ansible-playbook master_update.yml -K --tags hsd
# tags: hsd, wave, camera, timing, hightiming, jungfrau

# RM 2026-03-11: Initial version
# RM 2026-10-28: use import_playbook, fix service names and host groups, require a tag
---
- name: Require a device tag
  hosts: localhost
  gather_facts: false
  tags: always
  tasks:
    - name: Refuse to run without a device tag
      ansible.builtin.assert:
        that:
          - "'all' not in ansible_run_tags"
        fail_msg: >
          Select a device type with --tags (hsd, wave, camera, timing, hightiming, jungfrau).

- name: Update hsd
  import_playbook: srcf_manual.yml
  vars:
    host: TMO_hsd_drp:RIX_hsd_drp:XPP_hsd_drp
    driver: 7.4.0
    service: kcu_hsd
    firmware: hsd
  tags: hsd

# drp-srcf-cmp049 (XPP_wave_drp) runs the kcu_xpm settings, not kcu_wave, so it is excluded
- name: Update wave
  import_playbook: srcf_manual.yml
  vars:
    host: wave_drp:!XPP_wave_drp
    driver: 7.4.0
    service: kcu_wave
    firmware: wave
  tags: wave

- name: Update camera
  import_playbook: srcf_manual.yml
  vars:
    host: TMO_camera_drp:RIX_camera_drp
    driver: 7.4.0
    service: kcu
    firmware: camera
  tags: camera

- name: Update timing
  import_playbook: srcf_manual.yml
  vars:
    host: TMO_timing_drp:RIX_timing_drp
    driver: 7.4.0
    service: tdetsim_low
    firmware: timing
  tags: timing

- name: Update high-rate timing
  import_playbook: srcf_manual.yml
  vars:
    host: TMO_hightiming_drp:RIX_hightiming_drp
    driver: 7.4.0
    service: tdetsim_high
    firmware: timing
  tags: hightiming

- name: Update Jungfrau
  import_playbook: srcf_manual.yml
  vars:
    host: Jungfrau_drp:Jungfrau_rocky9_drp
    driver: 7.4.0
    service: kcu_jung
    firmware: jungfrau
  tags: jungfrau
