# This playbook updates the specified parameter in the ExecStart line of the datadev.service file to the given value.
# If the parameter is not already present on the ExecStart line, it will be added.
# It should be run if datadev.service is already installed, otherwise run files_update.yml before

# how to run the script
# ansible-playbook servicefile_single_update.yml -K -e host='TMO_hsd_drp RIX_hsd_drp XPP_hsd_drp' -e value='6400' -e var=cfgRxCount

---

- hosts: "{{ host }}"
  become: true

  pre_tasks:
    - name: Are the required extra variables defined?
      ansible.builtin.assert:
        that:
          - host is defined and host | length > 0
          - var is defined and var | length > 0
          - value is defined and value | length > 0
        fail_msg: >
          'host','var','value' must be supplied as
          extra variables (-e "host=... var=... value=...").

    - name: Check that the source service file exists on the controller
      ansible.builtin.stat:
        path: "/etc/systemd/system/datadev.service"
      register: service_stat
      failed_when: not service_stat.stat.exists

    - name: Check whether the ExecStart line exists
      ansible.builtin.command: grep -E '^ExecStart=' /etc/systemd/system/datadev.service
      register: execstart_check
      check_mode: false
      changed_when: false
      failed_when: execstart_check.rc > 1

    - name: Fail if no ExecStart line is present
      ansible.builtin.fail:
        msg: "No ExecStart line found in /etc/systemd/system/datadev.service"
      when: execstart_check.rc != 0

    - name: Check whether var is already present on the ExecStart line
      ansible.builtin.command: grep -E '^ExecStart=.*{{ var }}=[0-9]+' /etc/systemd/system/datadev.service
      register: var_check
      check_mode: false
      changed_when: false
      failed_when: var_check.rc > 1

  tasks:
    - name: Update var on the ExecStart line if already present
      ansible.builtin.replace:
        path: /etc/systemd/system/datadev.service
        regexp: '^(ExecStart=.*{{ var }}=)\d+'
        replace: '\g<1>{{ value }}'
      when: var_check.rc == 0
      notify: Reinstall

    - name: Append var to the ExecStart line if not present
      ansible.builtin.replace:
        path: /etc/systemd/system/datadev.service
        regexp: '^(ExecStart=.*\S)\s*$'
        replace: '\g<1> {{ var }}={{ value }}'
      when: var_check.rc != 0
      notify: Reinstall

  handlers:
    - name: Reinstall
      ansible.builtin.shell: |
        rmmod datadev 2>/dev/null || true
        systemctl daemon-reload
        systemctl start datadev.service
        systemctl enable datadev.service
