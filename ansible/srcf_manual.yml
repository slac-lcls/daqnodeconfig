# SRCF_manual.yml: full update of a node: driver, service file, sysctl.conf and firmware.
# = files_update.yml + firmware
# The driver is reloaded once at the end; if new firmware was written the node is then power-cycled.
#
# How to run the script
# ansible-playbook srcf_manual.yml -K -e host='TMO_hsd_drp RIX_hsd_drp XPP_hsd_drp'
# -e driver='6.9.0' -e service='kcu_hsd' -e firmware='hsd'

# RM 2026-03-11: Initial version
# RM 2026-04-03: Claude proofed
# 2026-10-28: rebuilt from the shared steps in tasks/ (Claude)
---
- hosts: "{{ host }}"
  gather_facts: true
  gather_subset:  # for faster loading of facts, only gather minimal facts and not all facts
  - '!all'
  - 'min'
  become: true

  vars:
    required_vars: [host, driver, service, firmware]

  tasks:
    - ansible.builtin.import_tasks: tasks/preflight.yml
    - ansible.builtin.import_tasks: tasks/driver.yml
    - ansible.builtin.import_tasks: tasks/service.yml
    - ansible.builtin.import_tasks: tasks/sysctl.yml
    - ansible.builtin.import_tasks: tasks/firmware.yml

  handlers:
    - ansible.builtin.import_tasks: handlers/datadev.yml
