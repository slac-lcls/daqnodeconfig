# This playbook updates the sysctl.conf on the nodes.
#
# how to run the script
# ansible-playbook sysctlOnly_update.yml -K -e host='TMO_hsd_drp RIX_hsd_drp XPP_hsd_drp'

# RM 2026-07-28: Initial version
# 2026-10-28: rebuilt from the shared steps in tasks/ (Claude)
---
- hosts: "{{ host }}"
  gather_facts: false
  become: true

  vars:
    required_vars: [host]

  tasks:
    - ansible.builtin.import_tasks: tasks/preflight.yml
    - ansible.builtin.import_tasks: tasks/sysctl.yml

  handlers:
    - ansible.builtin.import_tasks: handlers/datadev.yml
